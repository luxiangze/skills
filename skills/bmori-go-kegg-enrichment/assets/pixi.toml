[workspace]
name = "bmori-enrichment"
version = "0.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[feature.r.dependencies]
r-base = "4.5.3.*"
r-renv = "==1.2.3"
compilers = "==2.0.0"
make = "==4.4.1"
pkg-config = "==0.29.2"
r-pak = ">=0.11.1,<0.12"
glpk = ">=5.0,<6"
zlib = ">=1.3.1,<2"

[environments]
r = { features = ["r"], no-default-feature = true }
